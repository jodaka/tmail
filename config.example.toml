# Tmail v1 configuration (Phase 0 reference shape)
#
# Tmail and Himalaya share ONE file: this is the same config the Himalaya CLI
# reads (verified: himalaya 2.1.0 tolerates unknown root tables like [tmail]).
# Himalaya account/credential blocks stay untouched and keep their format:
# https://github.com/pimalaya/himalaya/blob/master/config.sample.toml

# ── Himalaya accounts (example below is the disposable Maildir probe) ──────
[accounts.probe]
email = "probe@tmail.local"
display-name = "Tmail Probe"

[accounts.probe.maildir]
root = "~/tmp/tmail-probe-maildir"

[accounts.probe.mailbox.alias]
inbox = "INBOX"
sent = "Sent"
drafts = "Drafts"
trash = "Archive"
archive = "Archive"

# ── Tmail-owned settings ────────────────────────────────────────────────────
[tmail]
# Name of the account (root table in this file) Tmail drives.
account = "probe"
# Basic mouse support (click mailbox/rows, wheel scroll).
mouse = true
# Message-list density: "compact" (one line per message, default) or
# "comfortable" (faint separator under every row, more negative space).
# view_mode = "comfortable"
# Seconds a status message stays up before it fades and clears;
# 0 (default) keeps it until the next message replaces it.
# status_timeout = 5
# Notifications for mail the periodic background refresh finds:
# "off" (default) stays silent, "bell" rings the terminal bell (\x07),
# "on" shows a desktop notification through notify-rust. Only mail that
# arrived since the previous background update notifies, and only while
# the terminal window is unfocused.
# notifications = "off"

[tmail.mail]
# Message list page size (explicit pagination).
page_size_auto = true
# Used only when page_size_auto = false.
page_size = 50
# Periodic background refresh, 0 disables. Foreground work is never preempted.
refresh_interval_seconds = 60

[tmail.composer]
# "builtin", "$EDITOR", or an explicit command like "nvim".
editor = "builtin"
# Debounce for draft autosave in the builtin editor.
autosave_delay_ms = 2000

[tmail.attachments]
# Directory used by "save attachment" (expanded in Tmail, never via a shell).
downloads_dir = "~/Downloads"

[tmail.theme]
name = "default"
# Fine-tune any color token with a hex value (ticket wrs7):
# background = "#0d1017"
# accent = "#fca311"
# name = "light"  # or switch to the built-in light theme

# Extra named themes for the theme picker (`t`, ticket k5ba): same color
# tokens as [tmail.theme] over the dark reference palette; built-ins list
# first. A theme named "default" or "light" replaces that built-in.
# [tmail.themes.nord]
# background = "#2e3440"
# accent = "#88c0d0"
# text = "#eceff4"

# Keyboard shortcuts (configurable keybindings). Every action with its
# default keys is listed below — uncomment the [tmail.keybindings.<context>]
# tables and edit freely. Setting an action's list REPLACES its defaults
# (an empty list unbinds the action); add a second key by listing both.
# Key syntax: `+`-joined modifiers (ctrl, alt) then a key — named keys
# ("esc", "enter", "tab", "backtab", "backspace", "delete", "home", "end",
# "pageup", "pagedown", "up", "down", "left", "right", "space", "f1"–"f12"),
# glyphs ("↑" "↓" "←" "→" "⌫" "↵"), or any single character ("j", "?", "]",
# "S" = the shifted character). A conflict with another action in the same
# table is refused with a startup warning; the escape hatches (cancel,
# activate, focus_next, focus_previous, quit) always keep at least one key.
#
# [tmail.keybindings.global]
# move_up = ["↑"]
# move_down = ["↓"]
# previous_page = ["←"]
# next_page = ["→", "Ctrl+]"]
# activate = ["↵"]
# cancel = ["Esc", "q"]
# focus_next = ["Tab"]
# focus_previous = ["Shift+Tab"]
# open_search = ["/"]
# compose = ["c"]
# refresh = ["Ctrl+r"]
# quit = ["Ctrl+c"]
# select_all = ["Ctrl+a"]
# toggle_mouse = ["m"]
# theme = ["t"]
# reply = ["r"]
# reply_all = ["a"]
# forward = ["f"]
# archive = ["e"]
# star = ["s"]
# mark_unread = ["u"]
# mark_read = ["i"]
# save_attachment = ["S"]
# open_attachment = ["o"]
# open_help = ["?", "Ctrl+h"]
#
# [tmail.keybindings.list]
# trash = ["d", "Delete"]
# toggle_selected = ["Space"]
#
# [tmail.keybindings.reader]
# trash = ["d", "Delete", "⌫"]

[tmail.cache]
# Viewed-message cache limits (ticket haeb). Least-recently-used entries
# are evicted first; max_messages = 0 disables message caching.
# max_messages = 50
# max_bytes = 10485760  # 10 MiB
