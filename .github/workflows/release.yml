# Release automation.
#
# Run manually from the Actions tab ("Release" -> "Run workflow"), from the
# branch you want to release from (usually master):
#   * pick the semver component to bump (patch / minor / major)
#   * optionally tick "dry run" to validate the bump without publishing
#
# The `bump` job edits Cargo.toml + Cargo.lock, commits, and tags v<X.Y.Z>.
# The `build` job produces release binaries for every supported target, and
# the `publish` job attaches tarballs plus SHA256 checksums to the GitHub
# release for the new tag, with a changelog assembled from the commits
# since the previous release. The `homebrew-tap` job syncs Formula/tmail.rb
# into the Homebrew tap so `brew install` picks up the new version.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump in Cargo.toml
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Validate the bump without committing, tagging, or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version, commit, and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          current="$(cargo read-manifest | jq -r .version)"

          # Rewrite the top-level [package] version in Cargo.toml and print
          # the new version.
          new="$(python3 .github/scripts/bump_version.py "$BUMP")"

          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::tag v$new already exists; delete it or bump a different component"
            exit 1
          fi

          # Sync the workspace member version in Cargo.lock without touching
          # third-party dependency versions. No --offline: fresh runners have
          # an empty cargo cache, so the registry index must be fetched.
          cargo update --workspace
          grep -A1 '^name = "tmail"$' Cargo.lock | grep -qx "version = \"$new\"" \
            || { echo "::error::Cargo.lock was not synced to $new"; exit 1; }

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "bumped $current -> $new"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: stopping before commit, tag, build, and release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $new"
          git tag -a "v$new" -m "tmail v$new"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/v$new"

  build:
    name: Build ${{ matrix.target }}
    needs: bump
    if: ${{ inputs.dry_run != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit Ubuntu versions (not ubuntu-latest): release binaries
          # inherit the runner's glibc, so the baseline must not drift.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
          # Windows port (issue sd7v): msvc ABI — no extra tools, the
          # windows-latest runner ships MSVC. The tar.gz stays tar.gz:
          # Windows 10+ ships bsdtar, so
          # `tar xzf tmail-v*.tar.gz && .\tmail.exe` works everywhere.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: tmail.exe
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl linker
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        # windows-latest defaults `run:` to pwsh; force the bash the
        # `set`/`tar` script was written for.
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.binary || 'tmail' }}"
          binary="target/${{ matrix.target }}/release/$name"
          test -x "$binary" || { echo "::error::release binary missing: $binary"; exit 1; }
          tar czf "tmail-v${VERSION}-${{ matrix.target }}.tar.gz" -C "$(dirname "$binary")" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: tmail-${{ matrix.target }}
          path: tmail-v${{ needs.bump.outputs.version }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish release
    needs: [bump, build]
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          # Full history (and tags) so the changelog can walk back to the
          # previous release commit. On a re-run of failed jobs the bump
          # outputs are gone; fall back to the dispatched branch, whose
          # head carries the bump commit (bump pushes HEAD to the same ref
          # atomically with the tag).
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Generate changelog from commits
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_changelog.py | tee release-notes.md

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum "tmail-v${VERSION}"-*.tar.gz > "SHA256SUMS-v${VERSION}.txt"
          cat "SHA256SUMS-v${VERSION}.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: tmail v${{ needs.bump.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: dist/*

  homebrew-tap:
    name: Update Homebrew tap
    # `bump` is not strictly needed to run after `publish` (which already
    # depends on it), but listing it keeps `needs.bump.outputs` valid for
    # the expressions below.
    needs: [bump, publish]
    # Opt-in until the tap exists: create the tap repository (e.g.
    # jodaka/homebrew-tap, public, with an empty Formula/ directory), then
    # set the repository variable TAP_REPO=<owner>/<name> and the TAP_TOKEN
    # secret (a fine-grained PAT with Contents: read/write on the tap).
    if: ${{ vars.TAP_REPO != '' }}
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.bump.outputs.version }}
      TAP_REPO: ${{ vars.TAP_REPO }}
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a re-run of failed jobs the bump outputs are gone; fall back
          # to the dispatched branch, whose head carries the bump commit
          # (bump pushes HEAD to the same ref atomically with the tag).
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}

      - name: Sync formula into tap
        run: |
          set -euo pipefail

          # A re-run of failed jobs does not re-execute the bump job, and
          # GitHub Actions drops `needs.*.outputs` on such re-runs. Fall
          # back to the release the `publish` job actually created (this
          # job only runs after publish, so it exists) — the same release
          # the checksums below are fetched from, so the version and the
          # sums can never disagree. Fail loudly if neither path
          # produces semver; never fall back to the working tree, whose
          # Cargo.toml may predate the bump (a stale read silently
          # re-syncs the previous release instead).
          if [ -z "${VERSION:-}" ]; then
            echo "::warning::bump job outputs missing (job re-run); deriving version from the latest published release"
            VERSION="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | jq -r '.tag_name | ltrimstr("v")')"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::could not determine release version (got: '${VERSION}')"; exit 1; }

          # Fetch the checksums published by the `publish` job (one API
          # round-trip; works while the repository is private too).
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}"
          asset_id="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
            | jq -r --arg name "SHA256SUMS-v${VERSION}.txt" \
              '.assets[] | select(.name == $name) | .id')"
          [ -n "$asset_id" ] \
            || { echo "::error::release v${VERSION} has no SHA256SUMS-v${VERSION}.txt asset"; exit 1; }
          curl -sS --fail-with-body -L -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o SHA256SUMS.txt "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp Formula/tmail.rb tap/Formula/tmail.rb
          python3 .github/scripts/patch_homebrew_formula.py "$VERSION"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tmail.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
          else
            git commit -m "tmail v${VERSION}"
            git push
          fi
