name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Build (smoke target)
        run: cargo build

      # Windows port work in progress: the smoke test (and its Unix-only
      # binary path) is not wired up for Windows yet.
      - name: Terminal lifecycle + opener/editor smoke
        if: ${{ runner.os != 'Windows' }}
        run: python3 fixtures/smoke/ci_smoke.py --bin target/debug/tmail
