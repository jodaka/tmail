# Tmail default theme (ticket dn04)
#
# The built-in "default" dark theme, written out as a ready-to-paste
# `[tmail.theme]` block. Every value below is exactly what Tmail uses when
# no theme overrides are configured, so you can start from this file and
# tune only the colors you want to change.
#
# Usage: copy the block into your Tmail config (the same TOML file
# himalaya reads) and adjust. Any subset of tokens may be listed —
# unspecified tokens keep the built-in values. `name` selects the base
# palette ("default" is the dark reference; "light" is the built-in light
# variant), and the color lines below override it token by token. Set the
# NO_COLOR environment variable (non-empty) to ignore all of this and
# render with the terminal's default colors.
#
# See `src/ui/theme.rs` for the authoritative palette and README.md
# ("Theming") for the user-facing guide.

[tmail.theme]
name = "default"
# Page background: fills everything no widget paints over.
background = "#0d1017"
# Input wells, list rows, panels (e.g. the search field, code blocks).
surface = "#0e182c"
# Hairlines and control borders: the lines under the list header, the
# sidebar divider, row separators in the comfortable view mode.
border = "#3a3f4a"
# Primary text: strongest content color (unread rows, headings).
text = "#e5e5e5"
# Soft primary text: read (non-unread) rows and ordinary content.
text_soft = "#bfbdb7"
# Secondary text: hints' labels and other supporting copy.
muted = "#929499"
# De-emphasized text: relative dates read rows carry in the list.
dim = "#787a82"
# Faded message-body preview in the list rows: dimmer than any subject,
# so the Gmail-style preview reads as context, never as content.
snippet = "#5d616a"
# Panel strip fill of the brand row, sidebar, and status bar: a touch
# lighter than the page background so the chrome reads as raised.
sidebar_bg = "#151820"
# Hint labels and the topbar version text: barely-there supporting copy.
label_dim = "#575e71"
# Secondary accent: the brand bullet (a supporting hue that never
# competes with `accent`).
accent2 = "#83bd63"
# Tertiary accent: the loader scanner while foreground work is in flight.
accent3 = "#75c0f9"
# Interactive highlight: the cursor row bar, selection focus, links,
# the status message, bulk-selection checkboxes.
accent = "#75c0f9"
# Selected row / active folder fill: the background behind the highlighted
# list row or the folder the cursor sits on.
accent_bg = "#141821"
# Bulk-selected row highlight (Space-marked rows): visibly distinct from
# the cursor fill, so checked rows read as "marked", not "focused".
bulk_selected_bg = "#46351b"
# Stars and warnings (the `*` star glyph on starred rows).
warning = "#fca311"
# Errors: failure details in modals and the status line.
error = "#e5484d"
# Focused-control selection fill: text selection inside focused controls.
selection = "#533c1a"
