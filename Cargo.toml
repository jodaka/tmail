[package]
name = "tmail"
version = "0.1.0"
edition = "2024"
description = "Post: a Gmail-inspired, keyboard-first terminal email client backed by the Himalaya CLI"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
async-trait = "0.1"
thiserror = "2"
toml = "0.9"
html2text = "0.17.1"
# Isolated download directories for attachment saves (plan §15: downloads
# never touch the destination until a collision-checked write is ready).
tempfile = "3"
# Raw-MIME support for the test fixture corpus only (feature `test-fixtures`);
# production builds never parse MIME — Himalaya does (ADR 0001).
mail-parser = { version = "0.11.8", optional = true, features = ["serde"] }
ratatui-textarea = "0.9.2"
mail-builder = "0.5.0"

[features]
test-fixtures = ["dep:mail-parser"]
