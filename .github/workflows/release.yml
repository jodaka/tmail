# Release automation.
#
# Run manually from the Actions tab ("Release" -> "Run workflow"), from the
# branch you want to release from (usually master):
#   * pick the semver component to bump (patch / minor / major)
#   * optionally tick "dry run" to validate the bump without publishing
#
# The `bump` job edits Cargo.toml + Cargo.lock, commits, and tags v<X.Y.Z>.
# The `build` job produces release binaries for every supported target, and
# the `publish` job attaches tarballs plus SHA256 checksums to the GitHub
# release for the new tag. The `homebrew-tap` job syncs Formula/tmail.rb
# into the Homebrew tap so `brew install` picks up the new version.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump in Cargo.toml
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Validate the bump without committing, tagging, or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version, commit, and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          current="$(cargo read-manifest | jq -r .version)"
          new="$(python3 - "$current" "$BUMP" <<'PY'
          import sys

          major, minor, patch = (int(part) for part in sys.argv[1].split("."))
          bump = sys.argv[2]
          if bump == "patch":
              patch += 1
          elif bump == "minor":
              minor += 1
              patch = 0
          elif bump == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              sys.exit(f"unknown bump kind: {bump}")
          print(f"{major}.{minor}.{patch}")
          PY
          )"

          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::tag v$new already exists; delete it or bump a different component"
            exit 1
          fi

          # Rewrite the top-level [package] version in Cargo.toml.
          python3 - "$new" <<'PY'
          import re
          import sys

          new = sys.argv[1]
          with open("Cargo.toml") as f:
              text = f.read()
          pattern = re.compile(r'(?m)^(version\s*=\s*")([^"]+)(")')
          if len(pattern.findall(text)) != 1:
              sys.exit("expected exactly one top-level version key in Cargo.toml")
          with open("Cargo.toml", "w") as f:
              f.write(pattern.sub(rf"\g<1>{new}\g<3>", text, count=1))
          PY

          # Sync the workspace member version in Cargo.lock without touching
          # third-party dependency versions. No --offline: fresh runners have
          # an empty cargo cache, so the registry index must be fetched.
          cargo update --workspace
          grep -A1 '^name = "tmail"$' Cargo.lock | grep -qx "version = \"$new\"" \
            || { echo "::error::Cargo.lock was not synced to $new"; exit 1; }

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "bumped $current -> $new"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: stopping before commit, tag, build, and release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $new"
          git tag -a "v$new" -m "tmail v$new"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/v$new"

  build:
    name: Build ${{ matrix.target }}
    needs: bump
    if: ${{ inputs.dry_run != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tmail"
          test -x "$binary" || { echo "::error::release binary missing: $binary"; exit 1; }
          tar czf "tmail-v${VERSION}-${{ matrix.target }}.tar.gz" -C "$(dirname "$binary")" tmail

      - uses: actions/upload-artifact@v7
        with:
          name: tmail-${{ matrix.target }}
          path: tmail-v${{ needs.bump.outputs.version }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish release
    needs: [bump, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum "tmail-v${VERSION}"-*.tar.gz > "SHA256SUMS-v${VERSION}.txt"
          cat "SHA256SUMS-v${VERSION}.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: tmail v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  homebrew-tap:
    name: Update Homebrew tap
    needs: publish
    # Opt-in until the tap exists: create the tap repository (e.g.
    # jodaka/homebrew-tap, public, with an empty Formula/ directory), then
    # set the repository variable TAP_REPO=<owner>/<name> and the TAP_TOKEN
    # secret (a fine-grained PAT with Contents: read/write on the tap).
    if: ${{ vars.TAP_REPO != '' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.bump.outputs.version }}
      TAP_REPO: ${{ vars.TAP_REPO }}
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Sync formula into tap
        run: |
          set -euo pipefail

          # A re-run of failed jobs does not re-execute the bump job, and
          # GitHub Actions drops `needs.*.outputs` on such re-runs. Fall back
          # to the version committed by bump (master head == the bumped
          # checkout), and fail loudly if neither path produces semver.
          version_pattern='s/^version = "\([0-9.]*\)"$/\1/p'
          if [ -z "${VERSION:-}" ]; then
            echo "::warning::bump job outputs missing (job re-run); deriving version from Cargo.toml"
            VERSION="$(sed -n "$version_pattern" Cargo.toml)"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::could not determine release version (got: '${VERSION}')"; exit 1; }

          # Fetch the checksums published by the `publish` job (one API
          # round-trip; works while the repository is private too).
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}"
          asset_id="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
            | python3 -c "import json, sys; print({a['name']: a['id'] for a in json.load(sys.stdin)['assets']}['SHA256SUMS-v${VERSION}.txt'])")"
          curl -sS --fail-with-body -L -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o SHA256SUMS.txt "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp Formula/tmail.rb tap/Formula/tmail.rb

          # Patch the copied formula to the new release: rewrite the
          # version line (release URLs interpolate it) and each sha256
          # line, matched by the target triple in the preceding URL.
          python3 - "$VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          sums = {}
          with open("SHA256SUMS.txt") as f:
              for line in f:
                  digest, name = line.split(maxsplit=1)
                  sums[name.strip()] = digest

          path = "tap/Formula/tmail.rb"
          with open(path) as f:
              text = f.read()
          text, count = re.subn(
              r'(?m)^  version "[^"]+"$', f'  version "{version}"', text
          )
          if count != 1:
              sys.exit(f"expected exactly one version line, patched {count}")

          triple = re.compile(
              r'tmail-v[^"]*-(aarch64-apple-darwin|x86_64-apple-darwin'
              r'|x86_64-unknown-linux-gnu)\.tar\.gz"'
          )
          sha = re.compile(r'^(\s*sha256 ")([0-9a-f]{64})(")$')
          lines = text.split("\n")
          pending = None
          patched = 0
          for i, line in enumerate(lines):
              match = triple.search(line)
              if match:
                  pending = match.group(1)
                  continue
              match = sha.match(line)
              if match and pending:
                  asset = f"tmail-v{version}-{pending}.tar.gz"
                  lines[i] = f'{match.group(1)}{sums[asset]}{match.group(3)}'
                  patched += 1
                  pending = None
          if patched != 3:
              sys.exit(f"expected 3 sha256 lines, patched {patched}")

          with open(path, "w") as f:
              f.write("\n".join(lines))
          PY

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tmail.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
          else
            git commit -m "tmail v${VERSION}"
            git push
          fi
