# Release automation.
#
# Run manually from the Actions tab ("Release" -> "Run workflow"), from the
# branch you want to release from (usually master):
#   * pick the semver component to bump (patch / minor / major)
#   * optionally tick "dry run" to validate the bump without publishing
#
# The `bump` job edits Cargo.toml + Cargo.lock, commits, and tags v<X.Y.Z>.
# The `build` job produces release binaries for every supported target, and
# the `publish` job attaches tarballs plus SHA256 checksums to the GitHub
# release for the new tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump in Cargo.toml
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Validate the bump without committing, tagging, or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version, commit, and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          current="$(cargo read-manifest | jq -r .version)"
          new="$(python3 - "$current" "$BUMP" <<'PY'
          import sys

          major, minor, patch = (int(part) for part in sys.argv[1].split("."))
          bump = sys.argv[2]
          if bump == "patch":
              patch += 1
          elif bump == "minor":
              minor += 1
              patch = 0
          elif bump == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              sys.exit(f"unknown bump kind: {bump}")
          print(f"{major}.{minor}.{patch}")
          PY
          )"

          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::tag v$new already exists; delete it or bump a different component"
            exit 1
          fi

          # Rewrite the top-level [package] version in Cargo.toml.
          python3 - "$new" <<'PY'
          import re
          import sys

          new = sys.argv[1]
          with open("Cargo.toml") as f:
              text = f.read()
          pattern = re.compile(r'(?m)^(version\s*=\s*")([^"]+)(")')
          if len(pattern.findall(text)) != 1:
              sys.exit("expected exactly one top-level version key in Cargo.toml")
          with open("Cargo.toml", "w") as f:
              f.write(pattern.sub(rf"\g<1>{new}\g<3>", text, count=1))
          PY

          # Sync the workspace member version in Cargo.lock without touching
          # third-party dependency versions. No --offline: fresh runners have
          # an empty cargo cache, so the registry index must be fetched.
          cargo update --workspace
          grep -A1 '^name = "tmail"$' Cargo.lock | grep -qx "version = \"$new\"" \
            || { echo "::error::Cargo.lock was not synced to $new"; exit 1; }

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "bumped $current -> $new"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: stopping before commit, tag, build, and release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $new"
          git tag -a "v$new" -m "tmail v$new"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/v$new"

  build:
    name: Build ${{ matrix.target }}
    needs: bump
    if: ${{ inputs.dry_run != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tmail"
          test -x "$binary" || { echo "::error::release binary missing: $binary"; exit 1; }
          tar czf "tmail-v${VERSION}-${{ matrix.target }}.tar.gz" -C "$(dirname "$binary")" tmail

      - uses: actions/upload-artifact@v4
        with:
          name: tmail-${{ matrix.target }}
          path: tmail-v${{ needs.bump.outputs.version }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish release
    needs: [bump, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum "tmail-v${VERSION}"-*.tar.gz > "SHA256SUMS-v${VERSION}.txt"
          cat "SHA256SUMS-v${VERSION}.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: tmail v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
